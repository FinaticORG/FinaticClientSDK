name: CI

on:
  pull_request:
    branches: [main, develop, staging, fdx-account-consent-v1]


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip heavy CI for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Skipping heavy product CI for Dependabot (Actions cost control)."
      - uses: actions/checkout@v7
        if: github.actor != 'dependabot[bot]'

      - uses: actions/setup-node@v7
        if: github.actor != 'dependabot[bot]'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: github.actor != 'dependabot[bot]'
        run: npm install

      - name: Lint
        if: github.actor != 'dependabot[bot]'
        run: npm run lint

      - name: Format check
        if: github.actor != 'dependabot[bot]'
        run: npm run format:check

      - name: Build
        if: github.actor != 'dependabot[bot]'
        run: npm run build

      - name: Unit tests with coverage gate
        if: github.actor != 'dependabot[bot]'
        run: npm run test:coverage -- --runInBand
